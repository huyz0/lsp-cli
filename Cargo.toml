[package]
name = "lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lsp"
path = "src/main.rs"

[[bin]]
name = "lsp-json-lsp"
path = "src/servers/json_lsp.rs"

[[bin]]
name = "lsp-css-lsp"
path = "src/servers/css_lsp.rs"

[[bin]]
name = "lsp-html-lsp"
path = "src/servers/html_lsp.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
regex = "1"
axum = "0.8.9"
hyper-util = { version = "0.1.20", features = ["server", "tokio", "http1"] }
tower = "0.5.3"
sha2 = "0.11.0"
chrono = "0.4.45"
walkdir = "2.5.0"
hyper = { version = "1.10.1", features = ["server", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "1"
notify = "6"

# For the bundled Rust-native language servers (src/servers/) — same crates
# rust-analyzer itself uses for the server side of the protocol (lsp_client.rs
# only ever implements the client side).
lsp-server = "0.10"
lsp-types = "0.97"
tree-sitter = "0.24"
tree-sitter-json = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"

[dev-dependencies]
tempfile = "3"
