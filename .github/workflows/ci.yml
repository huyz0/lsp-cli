name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # A gate. The pre-existing warnings this used to tolerate
      # (zombie-process lints in the test helpers, an
      # items-after-test-module nit) have been fixed, so the tree is clean
      # and can be kept that way.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is excluded, not an oversight: src/main.rs has a deliberate
    # `compile_error!` gating it out — the background daemon is Unix Domain
    # Socket-only today (see README "No Windows named-pipe support"), so
    # this genuinely does not compile there yet.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Per-language integration tests (rust_lang.rs, cpp_lang.rs, etc.)
      # are gated on a real language server being installed and skip
      # cleanly when it isn't — but GitHub's hosted images ship some of
      # them incidentally (rust-analyzer via the default rustup toolchain,
      # clangd via Xcode Command Line Tools on macOS), so the gate sees
      # "installed" and runs them against fixtures that were never meant to
      # be CI-validated. Those stay off the list.
      #
      # The four bundled servers do NOT fall in that category: they are
      # built from this repo by the same `cargo test` invocation, so their
      # gate is always true and their tests are as deterministic as any
      # unit test. They belong in CI and were only missing from it.
      #
      # `sync_protocol` (and the fake-server tests in `server`, `install`
      # and `mcp_stdio`) run against tests/support/fake_lsp.py, a scripted
      # server needing only python3, so they are deterministic too.
      #
      # `--lib` and the four `--bin lsp-*-lsp` targets are listed
      # explicitly because `--bin lsp` alone runs neither the shared
      # library's tests nor the servers' own.
      - run: >
          cargo test --release
          --lib
          --bin lsp
          --bin lsp-json-lsp --bin lsp-css-lsp --bin lsp-html-lsp --bin lsp-bash-lsp
          --test help --test install --test locate --test schema
          --test server --test mcp_stdio --test web --test bash_lang
          --test sync_protocol

  # The semantic tests against real language servers. Everywhere else they
  # skip when the server is missing, which is right on a developer machine
  # and meant they never ran in CI at all: every pinned definition line,
  # reference set, outline tree and stale-file scenario protected nothing
  # here. LSP_TEST_REQUIRE_SERVERS turns a skip into a failure for the
  # servers this job installs.
  test-servers:
    name: test (real language servers)
    runs-on: ubuntu-latest
    env:
      LSP_TEST_REQUIRE_SERVERS: typescript-language-server,basedpyright-langserver,gopls
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm install -g typescript-language-server typescript basedpyright
      - run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm install
        working-directory: tests/fixtures/typescript_project
      - run: >
          cargo test --release
          --test definition --test reference --test outline --test symbol
          --test doc --test calls --test diagnostics --test search
          --test doc_sync --test hierarchy --test python --test go_lang
          --test locate --test install --test watcher
